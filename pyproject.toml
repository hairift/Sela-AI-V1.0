[project]
name = "sela-ai"
version = "1.0.7"
description = "SELA AI - Asisten kampus berbasis suara (antarmuka web + mesin py-xiaozhi)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Perangkat lunak kepemilikan (proprietary). Lihat berkas LICENSE.
license = { text = "Proprietary" }
authors = [{ name = "Universitas Catur Insan Cendekia (UCIC)" }]
keywords = ["ai", "asisten-suara", "kampus", "sela", "ucic", "xiaozhi"]

dependencies = [
    # Antarmuka web (server lokal + jembatan WebSocket)
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    # Audio
    "sounddevice>=0.4.4",
    "soxr>=0.5.0",
    "opuslib>=3.0.1",
    # Jaringan
    "websockets>=11.0.3",
    "paho-mqtt>=2.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Jendela native tanpa bilah peramban untuk antarmuka SELA. Ditaruh di
    # dependensi utama supaya aplikasi hasil paket benar-benar terasa seperti
    # aplikasi desktop, bukan membuka tab peramban. Bila backend tidak
    # tersedia (mis. Linux tanpa GTK/Qt), launcher otomatis mundur ke
    # Chromium kiosk lalu peramban bawaan.
    "pywebview>=5.0",
    # AI/ML
    "openai>=1.0.0",
    "sherpa-onnx>=1.12.26",
    "sherpa-onnx-core>=1.12.26; sys_platform != 'win32'",
    # Gambar
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    # Kripto
    # Dibatasi <45: versi 45+ tidak lagi menyediakan wheel untuk macOS Intel
    # (x86_64), sehingga pip/uv harus mengompilasi dari sumber dan gagal di
    # runner CI (openssl-sys / maturin error). Versi 42-44 punya wheel siap
    # pakai untuk semua platform yang kami dukung.
    "cryptography>=42.0.0,<45",
    # Utilitas
    "psutil>=5.9.0",
    "pendulum>=3.0.0",
    "py-machineid>=0.6.0",
    "platformdirs>=4.0.0",
    # Media
    "mutagen>=1.47.0",
    # Teks
    "pypinyin>=0.51.0",
    "lunar_python>=1.3.0",
    # Clipboard & pintasan
    "pyperclip>=1.8.2",
    "pynput>=1.7.6",
    # ============================================================
    # Dependensi khusus platform (dipasang otomatis)
    # ============================================================
    # macOS
    "applescript>=2021.2.9; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    # Windows
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pycaw>=20230407; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    # Linux (mode GPIO / Raspberry Pi)
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Antarmuka QML lama (opsional; mode `web` tidak membutuhkannya).
# Pasang hanya bila ingin memakai `python main.py --mode gui`.
gui = [
    "PySide6>=6.6.0",
    "qasync>=0.27.1",
]
# Mode TUI (terminal layar penuh).
tui = [
    "textual>=0.80.0",
]
# Jendela native tanpa bilah peramban untuk antarmuka web (opsional).
# Bila tidak dipasang, SELA otomatis memakai peramban/Chromium kiosk.
native-window = [
    "pywebview>=5.0",
]

[project.scripts]
sela = "main:main"

[project.urls]
Homepage = "https://github.com/ucic/sela-ai"

# ============================================================
# Grup dependensi pengembangan
# ============================================================
[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "unifypy>=2.0.18",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
